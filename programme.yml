schema_version: 1

programme:
  id: collaborative-intelligence
  name: Collaborative Intelligence

repository:
  full_name: froekjaer/-Publication-Pipeline
  role: publication-and-programme-intelligence
  lifecycle: foundation
  status: active
  version: "1.0"
  default_branch: main

purpose:
  summary: >-
    Provide reproducible publication and derived programme-intelligence services without
    becoming the semantic or governance authority for source repositories.

ownership:
  owns:
    - publication-manifests
    - publication-build-provenance
    - editorial-transformation-rules
    - output-validation
    - programme-360-generation
  does_not_own:
    - programme-research-direction
    - canonical-mission-semantics
    - mission-specific-evidence
    - accountable-release-decisions-in-source-repositories

dependencies:
  consumes_from:
    - repository: froekjaer/collaborative-intelligence
      capability: programme architecture and declared repository catalogue
    - repository: froekjaer/mission-framework
      capability: canonical semantic and governance source material
    - repository: froekjaer/Mission-Platform
      capability: platform implementation declarations and evidence
    - repository: froekjaer/mission-solar-eclipse
      capability: greenfield mission evidence and publication sources
    - repository: froekjaer/timelapse-pro
      capability: pinned brownfield source evidence
  provides_to:
    - repository: froekjaer/collaborative-intelligence
      capability: reproducible Programme 360 reports and publication artefacts
    - repository: froekjaer/mission-framework
      capability: traceable publications of reviewed framework sources
    - repository: froekjaer/Mission-Platform
      capability: generated architecture and operational documentation

current:
  baseline: Foundation Release v1.0 / Documentation Generator 0.1
  initiative: Programme 360 generator prototype
  architecture_document: docs/programme-360.md
  status_document: README.md

publication:
  include:
    - README.md
    - docs/programme-360.md
    - schemas/programme-manifest.schema.json
  authority: Derived outputs do not supersede the owning source repository.
